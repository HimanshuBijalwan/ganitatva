# Ganitatva CI
#
# Owner: docs/platform/ (see docs/platform/00-setup-runbook.md, 01-scaffold-plan.md, 02-release-matrix.md).
#
# What this does, and why it's shaped this way:
#   1. content-validate  — schema-checks every concept YAML BEFORE anything else runs. Cheap, fast
#                           (ubuntu-latest, no Flutter needed), and it's the mechanical enforcement of
#                           ADR-003 ("a concept that doesn't name a real widget cannot merge").
#   2. analyze            — flutter analyze + flutter test (incl. golden tests once the widget kit lands).
#                           Also ubuntu-latest, also cheap. Every platform job below depends on this one
#                           succeeding first.
#   3. android / ios / macos / windows / linux — the 5 targets from ADR-005. android/ios/analyze run on
#                           ubuntu-latest or the cheapest capable runner; macos/ios use macos-latest
#                           (billed at a materially higher per-minute multiplier than Linux runners); windows
#                           uses windows-latest, which — per ADR-005 — is not a convenience here, it is the
#                           only Windows build machine that exists for this project.
#
# Gating everything behind (1) and (2) on the cheapest runner is deliberate: a broken YAML file or a failed
# unit test fails in under a minute on ubuntu-latest instead of after several minutes of macOS/Windows
# runner time. Flutter CI is slow; this ordering is where most of the real money/time is saved.
#
# NOTE: this workflow assumes the scaffold in docs/platform/01-scaffold-plan.md exists — pubspec.yaml at
# the repo root, and android/ios/macos/windows/linux/ generated by `flutter create .`. Until that scaffold
# lands, the content-validate job will pass (it has no Flutter dependency) and the rest will correctly fail
# with "pubspec.yaml not found" — that is expected, not a bug in this file.

name: Build

# PARKED UNTIL PHASE 5 (ADR-006 — web ships first, native second).
# This workflow is correct and stays here; there is simply no Flutter project to build yet, so
# running it on every push would fail noisily for a reason that is not a defect. When the native
# track opens in Phase 5, restore the push/pull_request triggers below.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  workflow_dispatch: {}

# Cancel superseded runs on the same branch/PR — avoids burning macOS/Windows minutes on a commit that's
# already obsolete because a newer push landed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; individual jobs opt into more only if they ever need it (none currently do).
permissions:
  contents: read

env:
  # Pinned to match docs/platform/00-setup-runbook.md and 01-scaffold-plan.md so local dev and CI never
  # drift apart. Bump all three together.
  FLUTTER_VERSION: "3.47.4"
  FLUTTER_CHANNEL: "stable"

jobs:
  # ---------------------------------------------------------------------------------------------------
  # 1. Content validation — every concept YAML against content/schema/concept.schema.json.
  #    Runs with ZERO Flutter dependency so it stays fast and never blocks on SDK setup.
  # ---------------------------------------------------------------------------------------------------
  content-validate:
    name: Validate content YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install validators
        run: pip install --quiet --disable-pip-version-check pyyaml==6.0.3 jsonschema==4.26.0

      - name: Validate every concept file against the schema
        shell: python
        run: |
          import json
          import pathlib
          import sys

          import yaml
          from jsonschema import Draft202012Validator

          root = pathlib.Path("content")
          schema_path = root / "schema" / "concept.schema.json"

          if not schema_path.exists():
              print(f"::error file={schema_path}::schema file is missing")
              sys.exit(1)

          schema = json.loads(schema_path.read_text())

          # The schema itself must be well-formed — a broken schema would otherwise silently validate
          # nothing.
          try:
              Draft202012Validator.check_schema(schema)
          except Exception as exc:  # jsonschema raises SchemaError
              print(f"::error file={schema_path}::schema is not a valid JSON Schema: {exc}")
              sys.exit(1)

          validator = Draft202012Validator(schema)

          concepts_dir = root / "concepts"
          concept_files = sorted(concepts_dir.rglob("*.yaml")) + sorted(concepts_dir.rglob("*.yml")) \
              if concepts_dir.exists() else []

          all_yaml = set(root.rglob("*.yaml")) | set(root.rglob("*.yml"))
          schema_dir = root / "schema"
          other_yaml = sorted(
              p for p in all_yaml
              if p not in concept_files and schema_dir not in p.parents
          )

          errors = 0

          for path in concept_files:
              try:
                  data = yaml.safe_load(path.read_text())
              except yaml.YAMLError as exc:
                  print(f"::error file={path}::invalid YAML syntax: {exc}")
                  errors += 1
                  continue

              for err in validator.iter_errors(data):
                  loc = "/".join(str(p) for p in err.path) or "<root>"
                  print(f"::error file={path}::[{loc}] {err.message}")
                  errors += 1

          # Non-concept content YAML (prerequisite graph, practice generator defs) — syntax-checked only;
          # they don't conform to the concept schema shape.
          for path in other_yaml:
              try:
                  yaml.safe_load(path.read_text())
              except yaml.YAMLError as exc:
                  print(f"::error file={path}::invalid YAML syntax: {exc}")
                  errors += 1

          print(
              f"Checked {len(concept_files)} concept file(s) against concept.schema.json, "
              f"{len(other_yaml)} other content YAML file(s) for syntax only."
          )

          if errors:
              print(f"::error::{errors} content validation error(s) found — see annotations above.")
              sys.exit(1)

          print("All content YAML valid.")

  # ---------------------------------------------------------------------------------------------------
  # 2. Static analysis + unit/widget/golden tests. Gate for every platform build below.
  # ---------------------------------------------------------------------------------------------------
  analyze:
    name: Analyze & test
    needs: content-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true # caches the Flutter SDK itself, keyed by version + OS

      - name: Cache pub packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage

  # ---------------------------------------------------------------------------------------------------
  # 3. Android — split-per-abi release APKs.
  # ---------------------------------------------------------------------------------------------------
  android:
    name: Android APK
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17" # matches the JDK 17 required by current Android Gradle Plugin; also matches
                              # the Homebrew OpenJDK 17 on the dev machine per 00-setup-runbook.md

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # Gradle build-cache + dependency cache, keyed automatically off the Gradle wrapper/lockfiles.
      - uses: gradle/actions/setup-gradle@v6.3.0

      - run: flutter pub get

      - name: Build split-per-abi release APKs
        run: flutter build apk --release --split-per-abi
        # NOTE: uses Flutter's default debug-signed release config until a real upload key exists —
        # see docs/platform/02-release-matrix.md for the signing plan. Good enough for an installable,
        # sideloadable CI artifact; not what ships to Play Store.

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------------------------------
  # 4. macOS — release .app build.
  # ---------------------------------------------------------------------------------------------------
  macos:
    name: macOS build
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - run: flutter pub get
      - run: flutter build macos --release

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-app
          path: build/macos/Build/Products/Release/*.app
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------------------------------
  # 5. iOS — UNSIGNED build check only. No Apple Developer account yet (docs/platform/02-release-matrix.md).
  #    This confirms the iOS target compiles; it does not produce an installable IPA.
  # ---------------------------------------------------------------------------------------------------
  ios:
    name: iOS (unsigned build check)
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - run: flutter pub get

      - name: Build unsigned (no codesign)
        run: flutter build ios --release --no-codesign

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ios-unsigned-app
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------------------------------
  # 6. Windows — the only Windows build machine this project has (ADR-005). Not optional infrastructure.
  # ---------------------------------------------------------------------------------------------------
  windows:
    name: Windows build
    needs: analyze
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.LOCALAPPDATA }}\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - run: flutter pub get
      - run: flutter build windows --release

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-build
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------------------------------
  # 7. Linux — free, low priority per ADR-005, but still built on every push.
  # ---------------------------------------------------------------------------------------------------
  linux:
    name: Linux build
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - run: flutter pub get
      - run: flutter build linux --release

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-build
          path: build/linux/x64/release/bundle/
          if-no-files-found: error
          retention-days: 14
